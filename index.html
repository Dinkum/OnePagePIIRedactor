<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-version" content="0.1.1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23090b10'/%3E%3Cpath d='M14 20h36v8H14zm0 16h24v8H14z' fill='%23fb7185'/%3E%3Cpath d='M42 36h8v8h-8z' fill='%235eead4'/%3E%3C/svg%3E">
  <title>One Page PII Redactor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-strong: #161b24;
      --ink: #f4f7fb;
      --muted: #9aa4b2;
      --line: #252b36;
      --line-strong: #3a4352;
      --accent: #fb7185;
      --accent-soft: rgba(251, 113, 133, 0.14);
      --accent-line: #fb7185;
      --ok: #5eead4;
      --warn: #fda4af;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      --radius: 8px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 50% -20%, rgba(251, 113, 133, 0.18), transparent 34rem),
        linear-gradient(180deg, #0d1017 0, #090b10 24rem),
        var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      overflow-y: auto;
    }

    button,
    textarea,
    .editor {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(220px, 1fr) auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 16, 0.78);
      backdrop-filter: blur(18px);
      z-index: 2;
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subhead {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .local-note {
      margin: 6px 0 0;
      color: #7f8a9a;
      font-size: 12px;
      line-height: 1.3;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .auto-copy-toggle {
      min-height: 38px;
      margin-left: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #151a23;
      color: var(--ink);
      padding: 8px 11px 8px 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .auto-copy-toggle:hover {
      border-color: #566174;
      color: var(--ink);
      background: #1d2330;
    }

    .auto-copy-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .toggle-switch {
      width: 30px;
      height: 18px;
      border: 1px solid #4b5565;
      border-radius: 999px;
      background: #0f131b;
      position: relative;
      flex: 0 0 auto;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #8b96a8;
      transition: transform 120ms ease, background 120ms ease;
    }

    .auto-copy-toggle input:checked + .toggle-switch {
      border-color: #fb7185;
      background: rgba(225, 29, 72, 0.38);
    }

    .auto-copy-toggle input:checked + .toggle-switch::after {
      transform: translateX(12px);
      background: #ffe4e6;
    }

    .auto-copy-toggle:focus-within {
      outline: 2px solid rgba(251, 113, 133, 0.3);
      outline-offset: 2px;
    }

    .button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #151a23;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease, transform 120ms ease;
      user-select: none;
      white-space: nowrap;
    }

    .button:hover {
      border-color: #566174;
      background: #1d2330;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      border-color: #fb7185;
      background: #e11d48;
      color: white;
    }

    .button.primary:hover {
      background: #be123c;
      border-color: #fda4af;
    }

    .button.icon {
      width: 38px;
      padding: 0;
    }

    .button[disabled] {
      cursor: not-allowed;
      transform: none;
    }

    .button.primary[disabled],
    .button.primary[disabled]:hover {
      border-color: var(--line-strong);
      background: #151a23;
      color: #6f7a8a;
      opacity: 1;
    }

    .main {
      width: min(1480px, 100%);
      min-height: 0;
      margin: 0 auto;
      padding: 14px 28px;
      display: grid;
    }

    .workspace {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
    }

    .editor {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      outline: 0;
      padding: 22px;
      background: #0f131b;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.72;
      letter-spacing: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      caret-color: var(--accent);
      cursor: text;
    }

    textarea.editor {
      resize: none;
    }

    .redaction-view[hidden],
    .editor-input[hidden] {
      display: none;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: #657080;
      pointer-events: none;
    }

    .redaction {
      appearance: none;
      border: 1px solid var(--accent-line);
      border-radius: 5px;
      background: var(--accent-soft);
      color: #ffe4e6;
      padding: 1px 5px 2px;
      margin: 0 1px;
      cursor: pointer;
      font: inherit;
      line-height: 1.45;
      position: relative;
      display: inline-block;
      box-shadow: inset 0 -1px 0 rgba(244, 63, 94, 0.18);
    }

    .redaction:hover,
    .redaction:focus-visible {
      background: rgba(251, 113, 133, 0.26);
      outline: 2px solid rgba(251, 113, 133, 0.28);
      outline-offset: 1px;
    }

    .redaction::after {
      content: attr(data-reveal);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      z-index: 4;
      width: max-content;
      max-width: min(360px, 70vw);
      padding: 8px 10px;
      border: 1px solid #475569;
      border-radius: 7px;
      background: #f8fafc;
      color: #0f172a;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.34);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -4px);
      transition: opacity 100ms ease, transform 100ms ease;
    }

    .redaction:hover::after,
    .redaction:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .redaction.restored {
      border-color: #5eead4;
      background: rgba(20, 184, 166, 0.16);
      color: #ccfbf1;
    }

    .statusbar {
      z-index: 3;
      border-top: 1px solid var(--line);
      background: rgba(9, 11, 16, 0.86);
      backdrop-filter: blur(18px);
      padding: 11px 28px;
    }

    .status-inner {
      width: min(1480px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .status {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .status strong {
      color: var(--ink);
    }

    .copy-state {
      color: var(--ok);
      font-size: 13px;
      white-space: nowrap;
    }

    .copy-state:not(:empty) {
      animation: copyFlash 1600ms ease both;
    }

    .copy-state:empty {
      visibility: hidden;
    }

    .copy-state.warn {
      color: var(--warn);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      text-decoration: none;
      white-space: nowrap;
    }

    .source-link svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .source-link:hover,
    .source-link:focus-visible {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @keyframes copyFlash {
      0% {
        opacity: 0;
        transform: translateY(3px);
      }
      12%,
      78% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-2px);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .topbar,
      .status-inner {
        align-items: stretch;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .main {
        padding: 12px 14px;
      }

      .copy-state {
        white-space: normal;
      }

      .status-line {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>One Page PII Redactor</h1>
        <p class="subhead">Paste text. Automatically redacted. Hover to view redaction. Click to undo redactions.</p>
        <p class="local-note">One self-contained file. No network requests. Completely local.</p>
      </div>
      <div class="toolbar" aria-label="Actions">
        <button class="button" id="pasteButton" type="button" title="Paste from clipboard" aria-label="Paste from clipboard">
          <span aria-hidden="true">Paste</span>
        </button>
        <button class="button primary" id="copyButton" type="button" title="Copy redacted text" aria-label="Copy redacted text">
          <span aria-hidden="true">Copy</span>
        </button>
        <button class="button" id="clearButton" type="button" title="Clear text" aria-label="Clear text">
          <span aria-hidden="true">Clear</span>
        </button>
        <label class="auto-copy-toggle" aria-label="Automatically copy redacted text">
          <input id="autoCopyToggle" type="checkbox" checked>
          <span class="toggle-switch" aria-hidden="true"></span>
          <span>Auto-copy</span>
        </label>
      </div>
    </header>

    <main class="main">
      <section class="workspace" aria-label="PII redaction editor">
        <textarea
          class="editor editor-input"
          id="editorInput"
          spellcheck="false"
          autocapitalize="off"
          placeholder="Paste text here."
        ></textarea>
        <div
          class="editor redaction-view"
          id="redactionBox"
          data-placeholder="Paste text here."
          tabindex="0"
          role="region"
          aria-label="Redacted text"
          hidden
        ></div>
      </section>
    </main>

    <footer class="statusbar">
      <div class="status-inner">
        <div class="status-line">
          <div class="status" id="statusText" role="status" aria-live="polite" aria-atomic="true"><strong>0</strong> characters, <strong>0</strong> redactions</div>
          <a class="source-link" href="https://github.com/Dinkum/OnePagePIIRedactor" rel="noopener" aria-label="Source on GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 0C3.58 0 0 3.67 0 8.2c0 3.63 2.29 6.7 5.47 7.79.4.08.55-.18.55-.39v-1.39c-2.23.5-2.7-1.1-2.7-1.1-.36-.95-.89-1.2-.89-1.2-.73-.51.06-.5.06-.5.8.06 1.22.85 1.22.85.72 1.26 1.88.9 2.34.69.07-.53.28-.9.5-1.1-1.78-.21-3.65-.91-3.65-4.05 0-.9.31-1.63.82-2.2-.08-.21-.36-1.05.08-2.18 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.99c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.97.08 2.18.51.57.82 1.3.82 2.2 0 3.15-1.87 3.84-3.66 4.05.29.26.55.76.55 1.53v2.22c0 .21.15.47.55.39A8.13 8.13 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"></path>
            </svg>
            <span>Source</span>
          </a>
        </div>
        <div class="copy-state" id="copyState" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const editorInput = document.getElementById("editorInput");
      const redactionBox = document.getElementById("redactionBox");
      const statusText = document.getElementById("statusText");
      const copyState = document.getElementById("copyState");
      const copyButton = document.getElementById("copyButton");
      const pasteButton = document.getElementById("pasteButton");
      const clearButton = document.getElementById("clearButton");
      const autoCopyToggle = document.getElementById("autoCopyToggle");

      const redactions = new Map();
      const restoredIds = new Set();
      let currentResult = null;
      let rawSourceText = "";
      let redactedPlainText = "";
      let autoCopyTimer = 0;
      let copyStateTimer = 0;
      let inputRenderTimer = 0;
      const autoCopyStorageKey = "one-page-pii-redactor:auto-copy";
      const maxRedactionCharacters = 200000;

      const detectors = [
        {
          type: "EMAIL",
          label: "email address",
          pattern: /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi
        },
        {
          type: "SSN",
          label: "SSN",
          pattern: /\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/g
        },
        {
          type: "CREDIT_CARD",
          label: "card number",
          pattern: /\b(?:card(?:holder)?|card number|card on file|amex|visa|mastercard)\b[^\d]{0,24}((?:\d[ -]*?){13,19})\b/gi,
          group: 1,
          validate: (value) => value.replace(/\D/g, "").length >= 13
        },
        {
          type: "CREDIT_CARD",
          label: "card number",
          pattern: /\b(?:\d[ -]*?){13,19}\b/g,
          validate: (value) => luhn(value.replace(/\D/g, ""))
        },
        {
          type: "PHONE",
          label: "phone number",
          pattern: /(?<!\w)(?:\+?1[\s.-]?)?(?:\(\d{3}\)|\d{3})[\s.-]?\d{3}[\s.-]?\d{4}(?:\s*(?:x|ext\.?|extension)\s*\d{1,6})?(?!\w)/gi,
          validate: (value) => value.replace(/\D/g, "").length >= 10
        },
        {
          type: "IP_ADDRESS",
          label: "IP address",
          pattern: /\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/g
        },
        {
          type: "IP_ADDRESS",
          label: "IP address",
          pattern: /(^|[^\p{L}\p{N}_])((?:[A-F0-9]{0,4}:){2,}[A-F0-9]{0,4}(?:%[A-Z0-9_.~-]+)?)(?=$|[^\p{L}\p{N}_])/giu,
          group: 2,
          validate: isValidIpv6
        },
        {
          type: "URL",
          label: "URL",
          pattern: /\bhttps?:\/\/[^\s<>"']+/gi
        },
        {
          type: "DATE_OF_BIRTH",
          label: "date of birth",
          pattern: /\b(?:DOB|D\.O\.B\.|date of birth|birth date|born)["']?[ \t]*(?:is|[:=#-])?[ \t]*["']?(\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{4}[/-]\d{1,2}[/-]\d{1,2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?[ \t]+\d{1,2},?[ \t]+\d{4})\b/gi,
          group: 1
        },
        {
          type: "DATE_OF_BIRTH",
          label: "date of birth",
          pattern: /\b(?:\d{1,2}[/-]\d{1,2}[/-](?:19|20)\d{2}|(?:19|20)\d{2}[/-]\d{1,2}[/-]\d{1,2})\b/g,
          validate: (_value, text, start) => !/\brelease date\s*$/i.test(text.slice(Math.max(0, start - 24), start))
        },
        {
          type: "ADDRESS",
          label: "street address",
          pattern: /\b\d{1,6}[ \t]+(?:[NSEW]\.?|North|South|East|West|NE|NW|SE|SW)?[ \t]*(?:[A-Z][a-z0-9.'-]*[ \t]+){0,7}(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Boulevard|Blvd\.?|Drive|Dr\.?|Lane|Ln\.?|Court|Ct\.?|Circle|Cir\.?|Way|Parkway|Pkwy\.?|Place|Pl\.?|Terrace|Ter\.?)\b(?:,?[ \t]*(?:Apt|Apartment|Unit|Suite|Ste|#)[ \t]*[A-Z0-9-]+)?(?:,?[ \t]+[A-Z][a-z]+(?:[ \t]+[A-Z][a-z]+){0,3},?[ \t]+[A-Z]{2}[ \t]+\d{5}(?:-\d{4})?)?/g
        },
        {
          type: "LOCATION",
          label: "location",
          pattern: /\b[A-Z][a-z]+(?:[ \t]+[A-Z][a-z]+){0,2},[ \t]+[A-Z]{2}[ \t]+\d{5}(?:-\d{4})?\b/g
        },
        {
          type: "TOKEN",
          label: "secret token",
          pattern: /\bBearer[ \t]+([A-Z0-9._~+/=-]{10,})\b/gi,
          group: 1
        },
        {
          type: "TOKEN",
          label: "secret token",
          pattern: /\b(?:[a-z0-9_]*password|api[_-]?key|access[_-]?token|session[_-]?token|signing[_-]?secret|token|secret|passwd|pwd|csrf)\b["']?[ \t]*(?:is|[:=])?[ \t]*["']?([^"'\s,;}{]{6,})/gi,
          group: 1
        },
        {
          type: "SSN",
          label: "SSN",
          pattern: /\bSSN[ \t]+last4[ \t:=-]*(\d{4})\b/gi,
          group: 1
        },
        {
          type: "CARD_EXPIRY",
          label: "card expiry",
          pattern: /\b(?:exp|expires|expiry)[ \t:=-]*(\d{1,2}\/\d{2,4})\b/gi,
          group: 1
        },
        {
          type: "ACCOUNT",
          label: "account number",
          pattern: /\b(?:account|acct|acct_id|customer_id|customer id|vendor[ \t]*id|member(?:[ \t]*id)?|employee[ \t]*id|badge[ \t]+member[ \t]*id|routing(?:[ \t]+account[ \t]+ref)?|iban|mrn|patient[ \t]*(?:id|no|number)?|patient_no|policy|checking[ \t]+account|target_account)\s*(?:number|no\.?|ref|#|id)?\s*(?:[:=#-])?[ \t]*["']?([A-Z0-9][A-Z0-9_-]{3,})\b/gi,
          group: 1,
          validate: (value) => /\d/.test(value) && value.replace(/[^A-Z0-9]/gi, "").length >= 5
        },
        {
          type: "ACCOUNT",
          label: "account number",
          pattern: /["']?(?:patient_no|patient_id|member_id|account_id|target_account)["']?[ \t,:=]+["']([A-Z0-9][A-Z0-9_-]{3,})["']/gi,
          group: 1,
          validate: (value) => /\d/.test(value) && value.replace(/[^A-Z0-9]/gi, "").length >= 5
        },
        {
          type: "ACCOUNT",
          label: "account number",
          pattern: /\b(?:ACCT?|ACC|CUST|MEMBER|MEM|MBR|MID|MRN|PT|PX|HN|EMP|EID|INS|HH|USR|TCK|VEND)[-_]?[A-Z0-9]+(?:[-_][A-Z0-9]+)*\b/g,
          validate: (value) => /\d/.test(value) && value.replace(/[^A-Z0-9]/gi, "").length >= 5
        },
        {
          type: "USERNAME",
          label: "username",
          pattern: /\b(?:username|user id|login)\s*[:#-]?\s*([A-Z0-9._-]{3,})\b/gi,
          group: 1
        },
        {
          type: "NAME",
          label: "person name",
          pattern: /\b(?:Mr\.|Mrs\.|Ms\.|Miss|Dr\.|Prof\.|Captain|Capt\.)[ \t]+(?:[A-Z]\.?|[A-Z][a-z]+(?:-[A-Z][a-z]+)?)(?:[ \t]+(?:[A-Z]\.?|[A-Z][a-z]+(?:-[A-Z][a-z]+)?)){0,3}\b/g
        },
        {

          editorInput.focus();
          if (selectionStart !== null && typeof editorInput.setSelectionRange === "function") {
            editorInput.setSelectionRange(selectionStart, selectionEnd ?? selectionStart);
          }
        }
      }

      function showRedactionMode() {
        editorInput.hidden = true;
        redactionBox.hidden = false;
      }

      function updateStatus(result) {
        const charLabel = rawSourceText.length === 1 ? "character" : "characters";
        if (!rawSourceText) {
          statusText.innerHTML = `<strong>0</strong> characters, <strong>0</strong> redactions`;
        } else if (result.skipped) {
          statusText.innerHTML = `<strong>${rawSourceText.length.toLocaleString()}</strong> ${charLabel}. Redaction skipped; limit is <strong>${maxRedactionCharacters.toLocaleString()}</strong> characters`;
        } else {
          statusText.innerHTML = `<strong>${rawSourceText.length.toLocaleString()}</strong> ${charLabel}, <strong>${result.count.toLocaleString()}</strong> redactions applied in <strong>${result.elapsed.toFixed(1)} ms</strong>`;
        }
        copyButton.disabled = !rawSourceText || result.skipped;
      }

      function loadAutoCopyPreference() {
        try {
          return localStorage.getItem(autoCopyStorageKey) !== "off";
        } catch {
          return true;
        }
      }

      function saveAutoCopyPreference() {
        try {
          localStorage.setItem(autoCopyStorageKey, autoCopyToggle.checked ? "on" : "off");
        } catch {
          // Some file:// or private browsing contexts may block localStorage.
        }
      }

      function autoCopyEnabled() {
        return autoCopyToggle.checked;
      }

      function clampIndex(value, max) {
        if (!Number.isFinite(value)) return max;
        return Math.max(0, Math.min(max, value));
      }

      function insertTextAt(text, start, end = start) {
        const safeStart = clampIndex(start, rawSourceText.length);
        const safeEnd = clampIndex(end, rawSourceText.length);
        const from = Math.min(safeStart, safeEnd);
        const to = Math.max(safeStart, safeEnd);
        return rawSourceText.slice(0, from) + text + rawSourceText.slice(to);
      }

      function pasteTextAt(text, start, end = start) {
        if (!text) return;
        const result = processRawText(insertTextAt(text, start, end), { autoCopy: true });
        setCopyState(result.skipped ? "Text too large to redact" : "Pasted and redacted", result.skipped);
      }

      function pasteIntoEditor(text) {
        const source = editorInput.value;
        const start = Number.isFinite(editorInput.selectionStart) ? editorInput.selectionStart : source.length;
        const end = Number.isFinite(editorInput.selectionEnd) ? editorInput.selectionEnd : start;
        rawSourceText = source;
        pasteTextAt(text, start, end);
      }

      function pasteIntoRedactionView(text, target) {
        const button = target?.closest?.(".redaction");
        const item = button ? redactions.get(button.dataset.id) : null;
        pasteTextAt(text, item ? item.end : rawSourceText.length);
      }

      function processRawText(text, { autoCopy = true, render = true } = {}) {
        rawSourceText = text;
        if (rawSourceText.length > maxRedactionCharacters) {
          window.clearTimeout(inputRenderTimer);
          window.clearTimeout(autoCopyTimer);
          redactions.clear();
          restoredIds.clear();
          redactedPlainText = "";
          redactionBox.innerHTML = "";
          currentResult = {
            parts: [],
            plain: "",
            count: 0,
            elapsed: 0,
            skipped: true
          };
          updateStatus(currentResult);
          if (render || editorInput.hidden) {
            showInputMode({ focus: false });
          } else {
            editorInput.value = rawSourceText;
          }
          return currentResult;
        }

        if (copyState.textContent === "Text too large to redact") {
          setCopyState("");
        }
        currentResult = redact(rawSourceText);
        redactedPlainText = currentResult.plain;
        if (render) {
          window.clearTimeout(inputRenderTimer);
          renderResult(currentResult);
          showRedactionMode();
        }
        updateStatus(currentResult);
        if (autoCopy && rawSourceText && autoCopyEnabled()) queueAutoCopy();
        if (!rawSourceText) {
          setCopyState("");
          showInputMode({ focus: false });
        }
        return currentResult;
      }

      function queueTypedRedaction() {
        window.clearTimeout(inputRenderTimer);
        if (!rawSourceText || !currentResult || currentResult.count === 0) return;
        inputRenderTimer = window.setTimeout(() => {
          if (editorInput.hidden) return;
          processRawText(editorInput.value, { autoCopy: true, render: true });
        }, 650);
      }

      function queueAutoCopy() {
        window.clearTimeout(autoCopyTimer);
        if (!autoCopyEnabled()) return;
        autoCopyTimer = window.setTimeout(() => {
          copyRedacted({ automatic: true });
        }, 120);
      }

      async function copyRedacted({ automatic = false } = {}) {
        if (automatic && !autoCopyEnabled()) return;
        if (automatic && restoredIds.size > 0) {
          setCopyState("Copy available");
          return;
        }

        if (!editorInput.hidden) {
          processRawText(editorInput.value, { autoCopy: false, render: true });
        }

        if (currentResult?.skipped) {
          setCopyState("Text too large to redact", true);
          return;
        }

        if (!redactedPlainText) {
          setCopyState("Nothing to copy", true);
          return;
        }

        try {
          await navigator.clipboard.writeText(redactedPlainText);
          setCopyState(automatic ? "Auto copied redacted text" : "Copied redacted text");
        } catch {
          if (automatic) {
            setCopyState("Copy available", false);
            return;
          }
          legacyCopy(redactedPlainText);
        }
      }

      function legacyCopy(text) {
        const hadEditorFocus = document.activeElement === editorInput;
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.className = "sr-only";
        document.body.appendChild(helper);
        helper.select();
        try {
          const copied = document.execCommand("copy");
          setCopyState(copied ? "Copied redacted text" : "Use Copy button after allowing clipboard access", !copied);
        } catch {
          setCopyState("Use Copy button after allowing clipboard access", true);
        } finally {
          helper.remove();
          if (hadEditorFocus) editorInput.focus();
        }
      }

      function setCopyState(message, warning = false) {
        window.clearTimeout(copyStateTimer);
        copyState.textContent = message;
        copyState.classList.toggle("warn", warning);
        if (message && !warning) {
          copyStateTimer = window.setTimeout(() => {
            copyState.textContent = "";
          }, 1600);
        }
      }

      async function pasteFromClipboard() {
        try {
          const text = await navigator.clipboard.readText();
          if (editorInput.hidden) {
            pasteTextAt(text, rawSourceText.length);
          } else {
            pasteIntoEditor(text);
          }
        } catch {
          showInputMode({ focus: true, selectionStart: rawSourceText.length });
          setCopyState("Paste into the box with keyboard", true);
        }
      }

      editorInput.addEventListener("paste", (event) => {
        event.preventDefault();
        const text = event.clipboardData?.getData("text/plain") || "";
        pasteIntoEditor(text);
      });

      editorInput.addEventListener("input", () => {
        processRawText(editorInput.value, { autoCopy: false, render: false });
        queueTypedRedaction();
      });

      redactionBox.addEventListener("click", (event) => {
        const button = event.target.closest(".redaction");
        if (!button) {
          showInputMode({ focus: true, selectionStart: rawSourceText.length });
          return;
        }
        const id = button.dataset.id;
        if (!redactions.has(id)) return;
        if (restoredIds.has(id)) {
          restoredIds.delete(id);
        } else {
          restoredIds.add(id);
        }
        renderResult(currentResult, { focusId: id });
        copyRedacted({ automatic: true });
      });

      redactionBox.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          showInputMode({ focus: true, selectionStart: rawSourceText.length });
          return;
        }
        if (event.target === redactionBox && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          showInputMode({ focus: true, selectionStart: rawSourceText.length });
        }
      });

      redactionBox.addEventListener("paste", (event) => {
        event.preventDefault();
        const text = event.clipboardData?.getData("text/plain") || "";
        pasteIntoRedactionView(text, event.target);
      });

      copyButton.addEventListener("click", () => copyRedacted({ automatic: false }));
      pasteButton.addEventListener("click", pasteFromClipboard);

      clearButton.addEventListener("click", () => {
        processRawText("", { autoCopy: false, render: false });
        showInputMode({ focus: true });
      });

      autoCopyToggle.checked = loadAutoCopyPreference();
      autoCopyToggle.addEventListener("change", () => {
        window.clearTimeout(autoCopyTimer);
        saveAutoCopyPreference();
        setCopyState(autoCopyToggle.checked ? "Auto-copy on" : "Auto-copy off");
      });

      processRawText("", { autoCopy: false, render: false });
      showInputMode({ focus: false });
    })();
  </script>
</body>
</html>
